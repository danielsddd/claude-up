name: Bug report
description: Something in a mod doesn't work
labels: [bug]
body:
  - type: dropdown
    id: mod
    attributes:
      label: Mod
      options: [damn-ddd, prompt-tools, other]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Claude Code version and app
      placeholder: 2.1.330, desktop app on Windows
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What you did and what you saw
      description: Steps, and the status line or any error. Never paste an API key.
    validations:
      required: true
